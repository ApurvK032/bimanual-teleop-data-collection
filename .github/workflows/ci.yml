name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # a stuck step must not run for GitHub's default 6 hours
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages
        timeout-minutes: 8
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install (teleop package + this package)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./teleop
          python -m pip install -e ".[session,dev]"
      - name: Lint
        run: ruff check .
      - name: Privacy check
        run: python scripts/check_public.py
      - name: Tests (no camera, Quest or arm needed)
        run: pytest -q
